name: Runtime audit export

on:
  push:
    branches:
      - agent/runtime-audit-export
  pull_request:
    branches:
      - agent/runtime-startup-simplification

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create source archive
        run: git archive --format=zip --output=gpthemes-runtime-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: gpthemes-runtime-source
          path: gpthemes-runtime-source.zip
          if-no-files-found: error
          retention-days: 1
