name: Audit source export

on:
  push:
    branches:
      - agent/audit-export-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=zip --output=gpthemes-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: gpthemes-source
          path: gpthemes-source.zip
          if-no-files-found: error
          retention-days: 1
