name: Audit source export

on:
  push:
    branches:
      - agent/audit-export-source
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture install diagnostics
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > pnpm-install.log 2>&1
          status=$?
          cat pnpm-install.log
          echo "$status" > pnpm-install-status.txt
          exit 0

      - name: Create source archive
        run: git archive --format=zip --output=gpthemes-source.zip HEAD

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpthemes-audit
          path: |
            gpthemes-source.zip
            pnpm-install.log
            pnpm-install-status.txt
          if-no-files-found: error
          retention-days: 1
